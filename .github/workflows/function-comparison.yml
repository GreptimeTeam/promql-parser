name: Function Comparison

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    name: Compare Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run function comparison
        id: compare
        # explicit shell: 'bash' in GitHub Actions means
        # `bash --noprofile --norc -eo pipefail`. `set +e` disables errexit
        # so the script's exit code can be captured from PIPESTATUS (pipefail
        # + `tee` would otherwise mask it) and exposed as a step output.
        # Exit codes: 0 = in sync, 1 = mismatch, 2 = operational error.
        shell: bash
        run: |
          set +e
          python scripts/compare_functions.py | tee comparison.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Create issue on scheduled mismatch
        # Only a confirmed mismatch (exit code 1) files an issue. Operational
        # failures (exit code 2, e.g. unable to fetch Prometheus functions.go)
        # still fail the job but must not create an "out of sync" issue that
        # would then suppress a later genuine mismatch report via dedup.
        if: github.event_name == 'schedule' && steps.compare.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="Function comparison failed: Rust functions out of sync with Prometheus"
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "in:title \"${ISSUE_TITLE}\"" \
            --json number \
            --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open issue already exists, skipping creation."
            exit 0
          fi
          {
            echo "The scheduled function comparison detected mismatches."
            echo ""
            echo "Rust functions in \`src/parser/function.rs\` are out of sync with"
            echo "[Prometheus functions.go](https://github.com/prometheus/prometheus/blob/main/promql/parser/functions.go)."
            echo ""
            echo "See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
            echo ""
            echo "<details><summary>Comparison output</summary>"
            echo ""
            echo '```'
            cat comparison.log
            echo '```'
            echo ""
            echo "</details>"
          } > issue_body.md
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file issue_body.md
